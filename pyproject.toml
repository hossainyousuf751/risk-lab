[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketrisk-lab"
version = "0.4.1"
description = "VaR/ES estimation and backtesting, and robust portfolio construction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.urls]
Repository = "https://github.com/hossainyousuf751/risk-lab"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
data = ["yfinance>=0.2"]
dev = ["pytest>=7", "matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: README-scale studies (tens of seconds); run with -m slow"]
addopts = "-m 'not slow'"
